; Template only. Get these values from the college PBX admin or SIP provider.
; Save your filled copy as runtime/deployment/asterisk/provider.conf.
; The provider must enable outbound calls and authorize the caller ID.
; Registration requirements and codecs vary: confirm this with the provider.
[provider-auth]
type=auth
auth_type=userpass
username=YOUR_PROVIDER_USERNAME
password=YOUR_PROVIDER_PASSWORD
[provider]
type=aor
contact=sip:YOUR_PROVIDER_SIP_HOST:5060
[provider]
type=endpoint
dtmf_mode=rfc4733
transport=transport-udp
context=from-provider
disallow=all
allow=ulaw,alaw
outbound_auth=provider-auth
aors=provider
from_user=YOUR_PROVIDER_USERNAME
from_domain=YOUR_PROVIDER_SIP_HOST
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
[provider-registration]
type=registration
transport=transport-udp
outbound_auth=provider-auth
server_uri=sip:YOUR_PROVIDER_SIP_HOST:5060
client_uri=sip:YOUR_PROVIDER_USERNAME@YOUR_PROVIDER_SIP_HOST:5060
retry_interval=60
